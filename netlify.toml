[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port    = 5173

# SPA redirect — all routes to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Netlify Functions → cleaner /api paths
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
